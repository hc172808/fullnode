services:
  gyds-fullnode:
    build: .
    container_name: gyds-fullnode
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GYDS_DASHBOARD_PORT:-5000}:${GYDS_DASHBOARD_PORT:-5000}" # Dashboard
      - "${GYDS_RPC_PORT:-8545}:${GYDS_RPC_PORT:-8545}"             # JSON-RPC
      - "${GYDS_WS_PORT:-8546}:${GYDS_WS_PORT:-8546}"               # WebSocket
      - "30303:30303" # P2P TCP
      - "30303:30303/udp"
    volumes:
      - fullnode-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "7"

volumes:
  fullnode-data:
