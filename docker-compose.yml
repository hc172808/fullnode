services:
  gyds-fullnode:
    build: .
    container_name: gyds-fullnode
    restart: unless-stopped
    env_file:
      - .env
    # The host data directory is represented by this named volume in Docker.
    # Override any host-specific GYDS_DATA_DIR from .env so state and the
    # dashboard PIN remain under the mounted /app/data path.
    environment:
      GYDS_DATA_DIR: /app/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 512m
    ports:
      - "${GYDS_DASHBOARD_PORT:-5000}:${GYDS_DASHBOARD_PORT:-5000}" # Dashboard
      - "${GYDS_RPC_PORT:-8545}:${GYDS_RPC_PORT:-8545}"             # JSON-RPC
      - "${GYDS_WS_PORT:-8546}:${GYDS_WS_PORT:-8546}"               # WebSocket
      - "30303:30303" # P2P TCP
      - "30303:30303/udp"
    volumes:
      - fullnode-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "7"

volumes:
  fullnode-data:
